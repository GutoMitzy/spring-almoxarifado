services:
  mysql_db:
    container_name: mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - almoxarifado_network


  mysql_db-test:
    container_name: mysql-test
    image: mysql:latest
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DATABASE_DEV}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - almoxarifado_network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "8090:5672"
      - "15672:15672"
    networks:
      - almoxarifado_network

  service-discover:
    build:
      context: ./service-discover
    container_name: service-discover
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - almoxarifado_network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - service-discover
    ports:
      - "8083:8083"
    networks:
      - almoxarifado_network

  ollama-engine:
    container_name: ollama-engine
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - almoxarifado_network
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull qwen2.5:3b
        wait

  prometheus:
    container_name: prometheus-engine
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - almoxarifado_network
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  mysql-exporter:
    container_name: mysql_exporter
    image: prom/mysqld-exporter
    restart: unless-stopped
    command:
      - "--mysqld.address=mysql_db-test:3306"
      - "--mysqld.username=${EXPORTER_MYSQL_USERNAME}"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${EXPORTER_MYSQL_PASSWORD}"
    ports:
      - "9104:9104"
    networks:
      - almoxarifado_network
    depends_on:
      - mysql_db-test

  cadvisor-exporter:
    container_name: cadvisor-exporter
    image: gcr.io/cadvisor/cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - almoxarifado_network

  grafana:
    container_name: grafana-engine
    image: grafana/grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - almoxarifado_network


networks:
  almoxarifado_network:
    name: almoxarifado_network
    driver: bridge

volumes:
  ollama_data:
  mysql_data:
  mysql_test_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data: