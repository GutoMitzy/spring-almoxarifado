services:
  mysql_db:
    container_name: mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - almoxarifado_network


  mysql_db-test:
    container_name: mysql-test
    image: mysql:latest
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - database_data:/root/.dbtest
    environment:
      MYSQL_DATABASE: ${DATABASE_DEV}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    ports:
      - "8090:5672"
      - "15672:15672"
    networks:
      - almoxarifado_network

  service-discover:
    build:
      context: ./service-discover
    container_name: service-discover
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - almoxarifado_network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      - service-discover
    ports:
      - "8083:8083"
    networks:
      - almoxarifado_network

  ollama-engine:
    container_name: ollama-engine
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - almoxarifado_network
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull qwen2.5:3b
        wait

networks:
  almoxarifado_network:
    driver: bridge

volumes:
  ollama_data:
  database_data: