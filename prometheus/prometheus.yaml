global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: spring-almoxarifado
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: mysql
    static_configs:
      - targets:
          - mysql_db-test:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: mysql-exporter:9104

  - job_name: docker
    static_configs:
      - targets:
          - cadvisor-exporter:8080
    metric_relabel_configs:
      - source_labels: [ 'name' ]
        target_label: 'container'