server:
  port: 8081

spring:
  application:
    name: spring-almoxarifado
  datasource:
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    url: jdbc:mysql://mysql_db:3306/${DATABASE_NAME}?createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  key: ${JWT_KEY}
  expiration: ${JWT_EXPIRATION:900000} #15minutos

rabbitmq:
  queue:
    name: NOTIFICATION_QUEUE