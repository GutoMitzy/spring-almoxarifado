server:
  port: 8080

logging:
  level:
    com.br.almoxarifado.almoxarifado: DEBUG

rate-limit:
  capacity: 20
  refill-tokens: 20
  refill-duration: 2

spring:
  application:
    name: spring-almoxarifado
  datasource:
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    url: jdbc:mysql://localhost:3307/${DATABASE_DEV}?createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
    data:
      redis:
        host: localhost
        port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # URL do Eureka Server

jwt:
  key: ${JWT_KEY}
  expiration: ${JWT_EXPIRATION:900000} #15minutos

rabbitmq:
  queue:
    name: NOTIFICATION_QUEUE
  exchange:
    name: NOTIFICATION_EXCHANGE
  routing:
    key: ALMOXARIFADO_ROUTING_KEY
  host: localhost
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: prometheus